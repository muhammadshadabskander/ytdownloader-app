name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip zip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libbz2-dev libreadline-dev \
            libsqlite3-dev liblzma-dev

      - name: Install buildozer + cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        env:
          # Android k C library ma 'grp' module k kuch functions
          # (setgrent/getgrent/endgrent) properly declared nahi hain, jis
          # waja sy naya compiler isay hard error treat kr leta hai. Ye
          # feature Android pr istemal hi nahi hoti, is liye is specific
          # warning ko error banany sy rok rahe hain.
          CFLAGS: -Wno-error=implicit-function-declaration
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-apk
          path: bin/*.apk
